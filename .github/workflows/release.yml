name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Manual runs build and smoke-test everything but never publish.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/

  binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-latest
            label: macos-arm64
          - os: windows-latest
            label: windows-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # librosa (timing extra) is left out: it pulls numba/llvmlite and bloats
      # the binaries; onset detection stays available via `pip install lrc-tools[full]`.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install ".[fetch,tui]"

      - name: Build binaries with PyInstaller
        run: python scripts/build_binary.py

      - name: Smoke-test binaries
        shell: bash
        run: |
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          for name in lrc-tools lrc-fetch lrc-processor lrc-vis; do
            "dist/$name$ext" --version
          done

      - name: Rename binaries per platform
        shell: bash
        run: |
          mkdir -p dist-bin
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          for name in lrc-tools lrc-fetch lrc-processor lrc-vis; do
            cp "dist/$name$ext" "dist-bin/$name-${{ matrix.label }}$ext"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.label }}
          path: dist-bin/

  publish:
    needs: [sdist, binaries]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-sdist
          path: dist

      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist-bin
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
            dist-bin/*
          generate_release_notes: true

      # Only runs when a PYPI_TOKEN secret is configured for the repository.
      - name: Publish to PyPI
        if: env.PYPI_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ env.PYPI_TOKEN }}
